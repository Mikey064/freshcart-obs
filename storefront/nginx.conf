resolver 127.0.0.11 valid=10s;

otel_exporter  { endpoint jaeger:4317; }
otel_service_name storefront;
otel_trace on;
otel_trace_context propagate;

server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — serve directly, or fall back to index.html for
    # any unmatched path so client-side routing (if added later) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the checkout-api container. "checkout-api" here
    # is the service name we'll define in docker-compose.yml — Docker's
    # embedded DNS resolves it automatically on the shared network.
    location /api/ {
        proxy_pass http://checkout-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}