apiVersion: apps/v1
kind: Deployment

metadata:
  name: jaeger
  namespace: freshcart

spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    
    spec:
      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
          args:
            - --set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318
            - --set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317
          ports:
            - { containerPort: 16686 }
            - { containerPort: 4317 }
            - { containerPort: 4318 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }

---
apiVersion: v1
kind: Service

metadata:
  name: jaeger
  namespace: freshcart

spec:
  selector:
    app: jaeger
  ports:
    - { name: ui, port: 16686 }
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }