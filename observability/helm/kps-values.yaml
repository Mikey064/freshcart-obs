# Control plane is managed by GKE, so we disable the control plane components in the kube-prometheus-stack chart to avoid conflicts with GKE's managed control plane.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }

nodeExporter: { enabled: false }
coreDns: { enabled: false }
kubeDns: { enabled: false }


prometheus:
  prometheusSpec:
    retention: 3d
    # pick up ServiceMonitor resources from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 700Mi }
      limits: { memory: 1500Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 10Gi } }

alertManager:
  alertManagerSpec:
    resources: 
      requests: { cpu: 20m, memory: 64Mi }
    
grafana:
  resources:
    requests: { cpu: 50m, memory: 200Mi }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      jsonData:
        derivedFields:
          - name: trace_id
            matcherRegeex: '"trace_id":"(\w+)"'
            url: '$${__value.raw}'
            datasourceUid: tempo
    
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          customQuery: true
          query: '{namespace="freshcart"} |= "$${__traces.traceId}"'
      

