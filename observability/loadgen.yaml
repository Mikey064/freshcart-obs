apiVersion: apps/v1
kind: Deployment

metadata:
  name: loadgen
  namespace: freshcart

spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["/bin/sh","-c"]
          args:
            - while true; do curl -s -o /dev/null -w "%{http_code}\n" http://storefront/api/products; sleep 0.2; done
          resources: { requests: { cpu: 20m, memory: 16Mi } }